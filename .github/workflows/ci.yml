name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: crash, POSTGRES_PASSWORD: crash, POSTGRES_DB: crashtest_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crash:crash@localhost:5432/crashtest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
