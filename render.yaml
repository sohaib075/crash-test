# Free deploy on Render (Dashboard → New → Blueprint → this repo).
# Creates the app (Docker) on Render's free plan. The database is a free Neon
# PostgreSQL: paste its DIRECT connection string (not the "-pooler" one) as
# DATABASE_URL when Render asks. Render also asks for the other `sync: false` values.
# Free plan: 512 MB RAM (each Node process is capped below to fit) and the app sleeps
# after 15 minutes without visitors; the first visit then takes about a minute.
# For a bigger instance, change `plan` (e.g. standard) and remove NODE_OPTIONS.
# Keep one instance: the worker runs as a singleton.
services:
  - type: web
    name: crash-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Neon → your project → Connect → turn "Connection pooling" off → copy the string.
      - key: DATABASE_URL
        sync: false
      # Render generates a random password; read it in the service's Environment tab.
      - key: APP_PASSWORD
        generateValue: true
      - key: GRAPH8_API_KEY
        sync: false
      # Leave empty with a live key (live-safe mode); the sandbox URL with a g8_sbx_ key.
      - key: GRAPH8_BASE_URL
        sync: false
      - key: GRAPH8_WORKSPACE_ID
        sync: false
      - key: GRAPH8_AI
        value: "on"
      - key: TEST_DOMAIN
        value: crashtest.example
      - key: DEMO_OWNER_EMAIL
        sync: false
      - key: LOG_LEVEL
        value: info
      # Keeps the three Node processes inside the free plan's 512 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=160
